<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">TechFinder interface concept</title>
<desc id="desc">Static concept with fictional data. A buyer requires 16 GB RAM and a budget of PKR 250,000. Two comparable offers cost PKR 239,000 and 249,000. A cheaper 8 GB variant is excluded and a listing with missing RAM is held for review.</desc>
<defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #162b35; }
    .muted { fill: #546b75; }
    .white { fill: #ffffff; }
    .green { fill: #12624d; }
    .small { font-size: 16px; }
    .body { font-size: 19px; }
    .label { font-size: 14px; font-weight: 700; letter-spacing: 1.7px; }
    .bold { font-weight: 700; }
  </style>
</defs>
<rect width="1440" height="1080" fill="#eef3f1"/>
<rect width="1440" height="94" fill="#122d35"/>
<rect x="48" y="27" width="40" height="40" rx="12" fill="#b4f1ce"/>
<path d="M58 38h20M68 38v20" stroke="#122d35" stroke-width="4" fill="none"/>
<text x="102" y="57" font-size="29" class="white bold">TechFinder</text>
<text x="341" y="56" class="body" style="fill:#bed2d8">A clearer way to buy tech.</text>
<rect x="1130" y="29" width="262" height="36" rx="18" fill="#29434b"/>
<text x="1261" y="52" text-anchor="middle" class="label white">STATIC DESIGN CONCEPT</text>
<text x="48" y="142" class="label green">CONFIGURATION FIRST. PRICE SECOND.</text>
<text x="48" y="197" font-size="43" class="bold">Same name. Different laptop.</text>
<text x="48" y="234" font-size="21" class="muted">Compare offers only after the details line up.</text>
<rect x="48" y="265" width="1344" height="97" rx="16" fill="#ffffff" stroke="#d4e0dc"/>
<text x="72" y="294" class="label muted">YOUR REQUIREMENTS</text>
<rect x="72" y="309" width="208" height="33" rx="16" fill="#eff5f3"/>
<text x="89" y="331" class="small bold">Budget: PKR 250,000</text>
<rect x="294" y="309" width="261" height="33" rx="16" fill="#eff5f3"/>
<text x="311" y="331" class="small bold">Programming + casual gaming</text>
<rect x="569" y="309" width="160" height="33" rx="16" fill="#eff5f3"/>
<text x="586" y="331" class="small bold">RAM: 16 GB min.</text>
<rect x="743" y="309" width="171" height="33" rx="16" fill="#eff5f3"/>
<text x="760" y="331" class="small bold">SSD: 512 GB min.</text>
<rect x="48" y="386" width="870" height="440" rx="18" fill="#ffffff" stroke="#d4e0dc"/>
<text x="76" y="424" class="label green">EXACT CONFIGURATION · EXAMPLE</text>
<text x="76" y="464" font-size="30" class="bold">TF-16-512</text>
<text x="76" y="498" class="body muted">16 GB RAM / 512 GB SSD / RTX 4050</text>
<rect x="76" y="520" width="375" height="32" rx="16" fill="#e3f5e9"/>
<text x="93" y="542" class="small green bold">Meets the stated RAM and budget limits</text>
<text x="76" y="590" class="small muted">2 comparable offers · same stated condition and warranty</text>
<line x1="76" y1="609" x2="890" y2="609" stroke="#dce5e1"/>
<text x="76" y="636" class="label muted">RETAILER</text>
<text x="409" y="636" class="label muted">ITEM PRICE</text>
<text x="645" y="636" class="label muted">MATCH EVIDENCE</text>
<text x="76" y="680" class="body bold">Retailer A</text>
<text x="409" y="680" font-size="24" class="bold green">PKR 239,000</text>
<text x="645" y="680" class="small green">Configuration checks pass</text>
<line x1="76" y1="702" x2="890" y2="702" stroke="#e2e9e5"/>
<text x="76" y="740" class="body bold">Retailer B</text>
<text x="409" y="740" font-size="24" class="bold">PKR 249,000</text>
<text x="645" y="740" class="small green">Configuration checks pass</text>
<rect x="76" y="766" width="814" height="36" rx="8" fill="#f1f5f3"/>
<text x="91" y="790" class="small muted">PKR 10,000 difference between these example offers. Delivery excluded.</text>
<rect x="942" y="386" width="450" height="440" rx="18" fill="#173b42"/>
<text x="970" y="425" class="label" style="fill:#b4f1ce">WHY THIS COMPARISON?</text>
<text x="970" y="470" font-size="25" class="white bold">Evidence you can inspect.</text>
<circle cx="979" cy="511" r="8" fill="#b4f1ce"/>
<text x="999" y="518" class="body white">Configuration identity checked</text>
<circle cx="979" cy="549" r="8" fill="#b4f1ce"/>
<text x="999" y="556" class="body white">Critical specifications agree</text>
<circle cx="979" cy="587" r="8" fill="#b4f1ce"/>
<text x="999" y="594" class="body white">Offer terms remain visible</text>
<line x1="970" y1="622" x2="1364" y2="622" stroke="#426169"/>
<text x="970" y="657" class="label" style="fill:#b4f1ce">STILL UNKNOWN IN THIS CONCEPT</text>
<text x="970" y="690" class="body white">GPU power limit · Battery endurance</text>
<text x="970" y="721" class="small" style="fill:#d1e1e1">No performance score without evidence.</text>
<text x="970" y="773" class="small" style="fill:#d1e1e1">Planned: source links and checked-at times</text>
<text x="970" y="798" class="small" style="fill:#d1e1e1">for each real offer.</text>
<rect x="48" y="850" width="657" height="145" rx="16" fill="#fff4df" stroke="#ecd9b6"/>
<text x="72" y="881" class="label" style="fill:#805512">CHEAPER, BUT DIFFERENT</text>
<text x="72" y="915" font-size="22" class="bold">Retailer C · PKR 215,000</text>
<text x="72" y="946" class="body">8 GB RAM — below your 16 GB requirement.</text>
<text x="72" y="974" class="small muted">Excluded from this exact-configuration comparison.</text>
<rect x="729" y="850" width="663" height="145" rx="16" fill="#edf0f8" stroke="#d6dceb"/>
<text x="753" y="881" class="label" style="fill:#455b8a">MORE EVIDENCE NEEDED</text>
<text x="753" y="915" font-size="22" class="bold">Retailer D · PKR 229,000</text>
<text x="753" y="946" class="body">RAM and configuration identity are missing.</text>
<text x="753" y="974" class="small muted">Held for review. Missing values are not assumed.</text>
<text x="48" y="1031" class="small bold">ILLUSTRATIVE ONLY · All products, retailers, prices and decisions are fictional.</text>
<text x="48" y="1057" class="small muted">Proposed interface, not a working application. No live prices, measured results or retailer affiliations.</text>
</svg>
